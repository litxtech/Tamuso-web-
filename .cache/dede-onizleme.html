<!DOCTYPE html><html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><style>html,body{margin:0;height:100%;background:#120818;overflow:hidden}#c{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script src="/playcanvas.js"></script><script>

function createDedeMotor() {
  var COLS = 6;
  var ROWS = 5;
  var MIN_CLUSTER = 5;
  var STAKES = [10, 25, 50, 100];
  var MVALS = [2, 3, 5, 10, 15, 25, 50, 100];
  var BAG = [
    ['amethyst', 24], ['emerald', 22], ['ruby', 20], ['sapphire', 18], ['topaz', 16],
    ['watch', 4], ['lantern', 3], ['key', 3], ['ring', 2], ['crown', 2], ['medallion', 4]
  ];
  var BASE = {
    amethyst: 1, emerald: 1, ruby: 2, sapphire: 2, topaz: 3,
    watch: 8, lantern: 10, key: 16, ring: 24, crown: 40
  };
  var RARITY = {
    amethyst: 'low', emerald: 'low', ruby: 'low', sapphire: 'low', topaz: 'low',
    watch: 'high', lantern: 'high', key: 'high', ring: 'high', crown: 'high', medallion: 'special'
  };
  var BAG_TOTAL = 0;
  for (var bi = 0; bi < BAG.length; bi++) BAG_TOTAL += BAG[bi][1];

  function hashSeed(text) {
    var h = 2166136261;
    var s = String(text || '');
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pickType(rng) {
    var roll = rng() * BAG_TOTAL;
    var acc = 0;
    for (var i = 0; i < BAG.length; i++) {
      acc += BAG[i][1];
      if (roll < acc) return BAG[i][0];
    }
    return 'amethyst';
  }
  function pickMult(rng) {
    var table = [2, 2, 2, 3, 3, 5, 5, 10, 15, 25, 50, 100];
    return table[Math.floor(rng() * table.length)];
  }
  function makeCell(id, type, row, col, rng) {
    return {
      id: id,
      type: type,
      row: row,
      column: col,
      assetId: type === 'medallion' ? 'dede_medallion' : 'sym_' + type,
      rarity: RARITY[type] || 'low',
      animationState: 'idle',
      multiplier: type === 'medallion' ? pickMult(rng) : 0
    };
  }
  function emptyGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) {
      g[r] = [];
      for (var c = 0; c < COLS; c++) g[r][c] = null;
    }
    return g;
  }
  function cloneGrid(grid) {
    var g = [];
    for (var r = 0; r < ROWS; r++) {
      g[r] = [];
      for (var c = 0; c < COLS; c++) {
        var cell = grid[r][c];
        g[r][c] = cell ? {
          id: cell.id, type: cell.type, row: r, column: c, assetId: cell.assetId,
          rarity: cell.rarity, animationState: 'idle', multiplier: cell.multiplier || 0
        } : null;
      }
    }
    return g;
  }
  function fillAll(rng, seq) {
    var grid = emptyGrid();
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var type = pickType(rng);
        grid[r][c] = makeCell('s' + (seq.n++), type, r, c, rng);
      }
    }
    return grid;
  }
  function stamp(grid, row, col, type, mult, seq, rng) {
    var cell = makeCell('s' + (seq.n++), type, row, col, rng);
    if (type === 'medallion') cell.multiplier = mult || 5;
    grid[row][col] = cell;
  }
  function groupsOf(grid) {
    var seen = {};
    var out = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var key = r + ',' + c;
        var start = grid[r][c];
        if (!start || start.type === 'medallion' || seen[key]) continue;
        var stack = [[r, c]];
        var cells = [];
        seen[key] = 1;
        while (stack.length) {
          var p = stack.pop();
          cells.push({ row: p[0], column: p[1], id: grid[p[0]][p[1]].id });
          var near = [[p[0] - 1, p[1]], [p[0] + 1, p[1]], [p[0], p[1] - 1], [p[0], p[1] + 1]];
          for (var i = 0; i < near.length; i++) {
            var rr = near[i][0];
            var cc = near[i][1];
            if (rr < 0 || cc < 0 || rr >= ROWS || cc >= COLS) continue;
            var k2 = rr + ',' + cc;
            var n = grid[rr][cc];
            if (seen[k2] || !n || n.type !== start.type) continue;
            seen[k2] = 1;
            stack.push([rr, cc]);
          }
        }
        if (cells.length >= MIN_CLUSTER) out.push({ type: start.type, cells: cells });
      }
    }
    return out;
  }
  function payOf(type, count, stake) {
    var sizeMul = count >= 12 ? 8 : count >= 9 ? 4 : count >= 7 ? 2 : 1;
    return Math.max(1, Math.round(BASE[type] * sizeMul * (count / 5) * stake / 10));
  }
  function gravity(grid, rng, seq) {
    var spawned = [];
    for (var c = 0; c < COLS; c++) {
      var kept = [];
      for (var r = ROWS - 1; r >= 0; r--) if (grid[r][c]) kept.push(grid[r][c]);
      var missing = ROWS - kept.length;
      var ordered = [];
      for (var i = 0; i < missing; i++) {
        var cell = makeCell('s' + (seq.n++), pickType(rng), i, c, rng);
        ordered.push(cell);
        spawned.push({ id: cell.id, column: c });
      }
      for (var k = kept.length - 1; k >= 0; k--) ordered.push(kept[k]);
      for (var row = 0; row < ROWS; row++) {
        var placed = ordered[row];
        placed.row = row;
        placed.column = c;
        grid[row][c] = placed;
      }
    }
    return spawned;
  }
  function clearCells(grid, cells) {
    for (var i = 0; i < cells.length; i++) grid[cells[i].row][cells[i].column] = null;
  }
  function medalSum(grid) {
    var list = [];
    var sum = 0;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = grid[r][c];
        if (cell && cell.type === 'medallion') {
          list.push({ id: cell.id, row: r, column: c, value: cell.multiplier });
          sum += cell.multiplier;
        }
      }
    }
    return { list: list, total: sum > 0 ? sum : 1, active: sum > 0 };
  }
  function quoteRound(opts) {
    var seed = String(opts.seed || 'DEDE_TEST_001');
    var stake = STAKES.indexOf(opts.stake) >= 0 ? opts.stake : 10;
    var force = opts.force || {};
    var rng = mulberry32(hashSeed(seed + '|' + stake + '|' + (opts.nonce || 0)));
    var seq = { n: 1 };
    var grid = fillAll(rng, seq);
    if (force.bigWin) {
      for (var r = 3; r < 5; r++) for (var c = 0; c < COLS; c++) stamp(grid, r, c, 'crown', 0, seq, rng);
    } else if (force.cascade) {
      for (var col = 0; col < COLS; col++) stamp(grid, 4, col, 'amethyst', 0, seq, rng);
    }
    if (force.multiplier || force.bigWin) stamp(grid, 0, 0, 'medallion', force.bigWin ? 25 : 10, seq, rng);
    var steps = [];
    var baseWin = 0;
    var cascadeIndex = 0;
    steps.push({ phase: 'POPULATE_GRID', grid: cloneGrid(grid), amount: 0, groups: [], cascadeIndex: 0 });
    var guard = 0;
    while (guard++ < 16) {
      var found = groupsOf(grid);
      var evalPhase = cascadeIndex === 0 ? 'EVALUATE' : 'RE_EVALUATE';
      if (!found.length) {
        steps.push({ phase: evalPhase, grid: cloneGrid(grid), amount: 0, groups: [], cascadeIndex: cascadeIndex });
        break;
      }
      var groups = [];
      var stepWin = 0;
      var remove = [];
      for (var g = 0; g < found.length; g++) {
        var amount = payOf(found[g].type, found[g].cells.length, stake);
        stepWin += amount;
        groups.push({ type: found[g].type, cells: found[g].cells, amount: amount });
        for (var ci = 0; ci < found[g].cells.length; ci++) remove.push(found[g].cells[ci]);
      }
      baseWin += stepWin;
      steps.push({ phase: evalPhase, grid: cloneGrid(grid), amount: stepWin, groups: groups, cascadeIndex: cascadeIndex });
      steps.push({ phase: 'WIN', grid: cloneGrid(grid), amount: stepWin, groups: groups, cascadeIndex: cascadeIndex });
      clearCells(grid, remove);
      steps.push({ phase: 'REMOVE_WINNERS', grid: cloneGrid(grid), amount: stepWin, groups: groups, cascadeIndex: cascadeIndex });
      gravity(grid, rng, seq);
      cascadeIndex += 1;
      steps.push({ phase: 'CASCADE', grid: cloneGrid(grid), amount: stepWin, groups: [], cascadeIndex: cascadeIndex });
    }
    var medals = medalSum(grid);
    var totalMultiplier = baseWin > 0 ? medals.total : 1;
    var totalWin = baseWin * totalMultiplier;
    if (baseWin > 0 && medals.active) {
      steps.push({ phase: 'MULTIPLIER', grid: cloneGrid(grid), amount: totalWin, groups: [], cascadeIndex: cascadeIndex, medals: medals.list, totalMultiplier: totalMultiplier });
    }
    var bigWin = totalWin >= stake * 15 && totalWin > 0;
    var bonus = medals.list.length >= 3;
    if (bonus && baseWin > 0) steps.push({ phase: 'BONUS', grid: cloneGrid(grid), amount: totalWin, groups: [], cascadeIndex: cascadeIndex, totalMultiplier: totalMultiplier });
    if (bigWin) steps.push({ phase: 'BIG_WIN', grid: cloneGrid(grid), amount: totalWin, groups: [], cascadeIndex: cascadeIndex, totalMultiplier: totalMultiplier });
    steps.push({ phase: 'ROUND_END', grid: cloneGrid(grid), amount: totalWin, groups: [], cascadeIndex: cascadeIndex, totalMultiplier: totalMultiplier });
    return {
      seed: seed,
      stake: stake,
      steps: steps,
      baseWin: baseWin,
      totalMultiplier: totalMultiplier,
      totalWin: totalWin,
      cascadeIndex: cascadeIndex,
      bigWin: bigWin,
      bonus: bonus,
      grid: cloneGrid(grid),
      multipliers: medals.list.map(function (m) { return m.value; })
    };
  }
  function createSession(balance) {
    return {
      sessionId: 'dede-' + hashSeed(String(balance) + ':' + Date.now()),
      roundId: '',
      grid: emptyGrid(),
      previousGrid: null,
      testBalance: balance,
      testStake: 10,
      baseWin: 0,
      multipliers: [],
      totalMultiplier: 1,
      totalWin: 0,
      cascadeIndex: 0,
      gameState: 'BOOT',
      bonusState: null,
      seed: 'DEDE_TEST_001',
      nonce: 0,
      roundNo: 0,
      assetFailure: false,
      force: {}
    };
  }
  function startRound(session) {
    if (session.gameState === 'ROUND_START' || session.gameState === 'POPULATE_GRID' || session.gameState === 'WIN' || session.gameState === 'CASCADE' || session.gameState === 'EVALUATE' || session.gameState === 'RE_EVALUATE' || session.gameState === 'REMOVE_WINNERS' || session.gameState === 'MULTIPLIER' || session.gameState === 'BIG_WIN' || session.gameState === 'BONUS') {
      return null;
    }
    if (session.testBalance < session.testStake) return null;
    session.previousGrid = cloneGrid(session.grid);
    session.testBalance -= session.testStake;
    session.roundNo += 1;
    session.nonce += 1;
    session.roundId = session.seed + '-' + session.roundNo;
    session.gameState = 'ROUND_START';
    session.totalWin = 0;
    session.baseWin = 0;
    session.totalMultiplier = 1;
    session.bonusState = null;
    var round = quoteRound({ seed: session.seed, stake: session.testStake, nonce: session.nonce, force: session.force || {} });
    session.force = {};
    return round;
  }
  function commit(session, round) {
    session.testBalance += round.totalWin;
    session.baseWin = round.baseWin;
    session.totalWin = round.totalWin;
    session.totalMultiplier = round.totalMultiplier;
    session.multipliers = round.multipliers.slice();
    session.cascadeIndex = round.cascadeIndex;
    session.grid = cloneGrid(round.grid);
    session.bonusState = round.bonus ? 'medallion' : null;
    session.gameState = 'READY';
  }
  function cellAnim(phase) {
    if (phase === 'POPULATE_GRID' || phase === 'CASCADE') return 'drop';
    if (phase === 'WIN' || phase === 'EVALUATE' || phase === 'RE_EVALUATE') return 'win';
    if (phase === 'REMOVE_WINNERS') return 'break';
    if (phase === 'MULTIPLIER') return 'collect';
    return 'idle';
  }
  function dropOffset(progress, col) {
    var local = (progress - col * 0.07) / 0.78;
    if (local <= 0) return 5.4;
    if (local >= 1) return 0;
    var eased = 1 - Math.pow(1 - local, 3);
    if (local > 0.8) eased += Math.sin(((local - 0.8) / 0.2) * Math.PI) * 0.08;
    return (1 - Math.min(1.08, eased)) * 5.2;
  }
  function duration(phase) {
    if (phase === 'POPULATE_GRID') return 1.05;
    if (phase === 'EVALUATE' || phase === 'RE_EVALUATE') return 0.22;
    if (phase === 'WIN') return 0.7;
    if (phase === 'REMOVE_WINNERS') return 0.46;
    if (phase === 'CASCADE') return 0.86;
    if (phase === 'MULTIPLIER') return 1.05;
    if (phase === 'BIG_WIN') return 1.7;
    if (phase === 'BONUS') return 0.7;
    return 0.25;
  }
  function dedeMood(phase, round, step) {
    if (phase === 'BIG_WIN' || phase === 'BONUS') return 'BIG_WIN';
    if (phase === 'WIN' || phase === 'REMOVE_WINNERS') return 'HAPPY';
    if (phase === 'MULTIPLIER') return 'SURPRISED';
    if (phase === 'CASCADE' || phase === 'RE_EVALUATE') return 'WATCHING';
    if (phase === 'ROUND_END' && round.totalWin <= 0) return 'WAITING';
    if (phase === 'POPULATE_GRID') return 'WATCHING';
    return 'IDLE';
  }
  function voiceFor(phase, round, step) {
    if (phase === 'POPULATE_GRID' && round.cascadeIndex >= 0 && step.cascadeIndex === 0) return null;
    if (phase === 'WIN' && step.cascadeIndex === 0) return 'Güzel gidiyor.';
    if (phase === 'CASCADE' && step.cascadeIndex === 1) return 'Bir tane daha!';
    if (phase === 'CASCADE' && step.cascadeIndex > 1) return 'Devam et!';
    if (phase === 'MULTIPLIER') return 'Şans kapıyı çaldı.';
    if (phase === 'BIG_WIN') return 'İşte bu!';
    return null;
  }
  function createPresenter(round, shownWin) {
    var index = 0;
    var t = 0;
    var running = true;
    function frame() {
      var step = round.steps[index];
      var phase = step.phase;
      var k = Math.min(1, t / duration(phase));
      var winIds = {};
      var groups = step.groups || [];
      for (var g = 0; g < groups.length; g++) {
        for (var i = 0; i < groups[g].cells.length; i++) winIds[groups[g].cells[i].id] = 1;
      }
      var cells = [];
      var grid = step.grid;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cell = grid[r][c];
          if (!cell) continue;
          var marked = !!winIds[cell.id];
          var anim = 'idle';
          var offset = 0;
          if (phase === 'POPULATE_GRID') {
            anim = 'drop';
            offset = dropOffset(k, c);
          } else if (phase === 'CASCADE') {
            anim = 'drop';
            offset = dropOffset(k, c) * 0.72;
          } else if ((phase === 'WIN' || phase === 'EVALUATE' || phase === 'RE_EVALUATE') && marked) anim = 'win';
          else if (phase === 'REMOVE_WINNERS' && marked) anim = 'break';
          else if (phase === 'MULTIPLIER' && cell.type === 'medallion') anim = 'collect';
          cells.push({

            assetId: cell.assetId, rarity: cell.rarity, animationState: anim, offset: offset, win: marked

        }

      var counted = shownWin;
      if (phase === 'WIN' || phase === 'REMOVE_WINNERS' || phase === 'CASCADE' || phase === 'MULTIPLIER' || phase === 'BIG_WIN' || phase === 'BONUS' || phase === 'ROUND_END') {
        counted = Math.round(round.baseWin * (phase === 'MULTIPLIER' || phase === 'BIG_WIN' || phase === 'BONUS' || phase === 'ROUND_END' ? (0.35 + 0.65 * k) * (round.totalMultiplier || 1) / (round.totalMultiplier || 1) : 1));
        if (phase === 'MULTIPLIER' || phase === 'BIG_WIN' || phase === 'BONUS' || phase === 'ROUND_END') {
          counted = Math.round(round.totalWin * k);

      }
      return {

        cells: cells,
        progress: k,
        winShown: phase === 'ROUND_END' ? round.totalWin : counted,
        totalMultiplier: round.totalMultiplier,
        cascadeIndex: step.cascadeIndex || 0,
        dede: dedeMood(phase, round, step),
        voice: k < 0.08 ? voiceFor(phase, round, step) : null,
        burst: phase === 'REMOVE_WINNERS' ? 'break' : phase === 'MULTIPLIER' ? 'gold' : phase === 'BIG_WIN' ? 'confetti' : phase === 'WIN' ? 'spark' : 'none',
        medals: step.medals || [],

      tick: function (dt) {

          last.done = true;
          last.gameState = 'READY';
          last.winShown = round.totalWin;

        var step = round.steps[index];

          index += 1;

            index = round.steps.length - 1;

            end.done = true;
            end.gameState = 'READY';
            end.winShown = round.totalWin;
            end.dede = round.totalWin > 0 ? 'HAPPY' : 'WAITING';
            return end;
          }

  return {
    columns: COLS,
    rows: ROWS,
    stakes: STAKES,
    multipliers: MVALS,
    quoteRound: quoteRound,
    createSession: createSession,
    startRound: startRound,
    commit: commit,
    createPresenter: createPresenter,
    hashSeed: hashSeed
  };
}

    var fill = new pc.Entity('fill');
    fill.addComponent('light', { type: 'directional', intensity: 0.45, color: night ? new pc.Color(0.35, 0.4, 0.7) : new pc.Color(0.55, 0.48, 0.8), castShadows: false });
    fill.setEulerAngles(-20, 160, 0);
    app.root.addChild(fill);
    var rim = new pc.Entity('rim');
    rim.addComponent('light', { type: 'directional', intensity: 0.55, color: new pc.Color(1, 0.82, 0.45), castShadows: false });
    rim.setEulerAngles(20, -140, 0);
    app.root.addChild(rim);
  }
  function ses(name) { if (audio) audio.cue(name); }
  function hud() {
    document.getElementById('dede-bakiye').textContent = 'TEST ' + para(session.testBalance);
    document.getElementById('dede-tur').textContent = 'TUR ' + String(session.roundNo).padStart(2, '0');
    document.getElementById('dede-tutar').textContent = winShown > 0 ? '+' + para(winShown) : '0';
    var carpan = document.getElementById('dede-carpan');
    carpan.textContent = round && round.totalMultiplier > 1 ? 'ÇARPAN x' + round.totalMultiplier : '';
    document.getElementById('dede-pay').textContent = String(session.testStake);
    document.getElementById('dede-oyna').disabled = running || !ready || session.testBalance < session.testStake;
  }
  function senkron(frame) {
    if (fail) return;
    var gorunen = {};
    var yeni = false;
    for (var i = 0; i < frame.cells.length; i++) {
      var cell = frame.cells[i];
      gorunen[cell.id] = 1;
      var node = nodes[cell.id];
      if (!node) {
        node = sembol(cell.type, cell.multiplier);
        nodes[cell.id] = node;
        yeni = true;
      }
      var p = yer(cell);
      if (cell.animationState === 'collect') {
        var k = frame.progress;
        p[0] = p[0] * (1 - k);
        p[1] = p[1] + ( -1.35 - p[1]) * k;
      }
      node.setPosition(p[0], p[1], 0);
      node.enabled = cell.animationState !== 'break' || frame.progress < 0.72;
      var pulse = cell.animationState === 'win' ? 1 + Math.sin(frame.progress * 3.14) * 0.08 : cell.animationState === 'break' ? Math.max(0.2, 1 - frame.progress) : 1;
      node.setLocalScale(pulse, pulse, pulse);
      if (cell.animationState === 'break' && frame.progress > 0.35 && frame.progress < 0.5) patlat(p, 'break');
      if (cell.animationState === 'collect' && frame.progress > 0.2 && frame.progress < 0.35) patlat(p, 'gold');
    }
    if (yeni) ses('symbol_drop');
    Object.keys(nodes).forEach(function (id) {
      if (id === 'dede' || id === 'portre') return;
      if (!gorunen[id]) {
        if (nodes[id].destroy) nodes[id].destroy();
        delete nodes[id];
      }
    });
    var dede = nodes.dede;
    if (dede) {
      var mood = frame.dede;
      var bob = Math.sin(clock * 1.6) * 0.03;
      dede.setPosition(0, 1.72 + gridShift + bob, 0.35);
      if (dede._head) dede._head.setEulerAngles(Math.sin(clock * 0.8) * 4, Math.sin(clock * 0.5) * 6, 0);
      if (dede._arm && dede._cane) {
        var lift = mood === 'HAPPY' || mood === 'BIG_WIN' || mood === 'SURPRISED' ? -28 : 8;
        if (mood === 'WAITING') lift = 16;
        dede._cane.setEulerAngles(lift, 0, mood === 'BIG_WIN' ? -18 : 0);
        dede._arm.setEulerAngles(lift * 0.4, 0, 0);
      }
      if (mood === 'BIG_WIN' && frame.progress > 0.15 && frame.progress < 0.28) patlat([0.1, 1.8, 0.2], 'confetti');
    }
    winShown = frame.winShown || 0;
    if (frame.bigWin) {
      var buyuk = document.getElementById('dede-buyuk');
      buyuk.style.display = 'flex';
      document.getElementById('dede-buyuk-sayi').textContent = '+' + para(Math.round((round.totalWin || 0) * frame.progress));
    }
    if (frame.voice) soyle(frame.voice);
    if (frame.burst === 'spark' && frame.progress < 0.1) ses('symbol_win');
    if (frame.burst === 'break' && frame.progress < 0.1) { ses('symbol_break'); haptic('win'); }
    if (frame.burst === 'gold' && frame.progress < 0.1) { ses('multiplier_spawn'); haptic('multiplier'); }
    if (frame.burst === 'confetti' && frame.progress < 0.1) { ses('big_win'); haptic('big'); }
    hud();
    session.gameState = frame.gameState;
  }
  function oynat() {
    if (!ready || running || fail) return;
    if (session.testBalance < session.testStake) return;
    if (audio) { audio.resume(); audio.startMusic(); }
    ses('button_press');
    ses('round_start');
    haptic('play');
    soyle(session.roundNo === 0 ? 'Haydi bakalım.' : 'Konak bugün hareketli.');
    round = motor.startRound(session);
    if (!round) return;
    running = true;
    presenter = motor.createPresenter(round, 0);
    document.getElementById('dede-buyuk').style.display = 'none';
    document.getElementById('dede-oyna').disabled = true;
    hud();
  }
  function vitrin() {
    var ornek = motor.quoteRound({ seed: 'DEDE_VITRIN', stake: session.testStake, nonce: 1 });
    var sahte = motor.createPresenter(ornek, 0);
    var kare = sahte.tick(0.02);
    var adim = 0;
    while (kare.gameState === 'POPULATE_GRID' && kare.progress < 0.96 && adim < 40) {
      kare = sahte.tick(0.04);
      adim += 1;
    }
    kare.gameState = 'READY';
    kare.voice = null;
    kare.burst = 'none';
    senkron(kare);
  }
  function hazirBitir() {
    ready = !fail;
    session.gameState = fail ? 'ERROR' : 'READY';
    var load = document.getElementById('dede-load');
    if (load) load.style.display = 'none';
    document.getElementById('dede-oyna').disabled = !ready;
    hud();
    if (ready && !saidReady) {
      saidReady = true;
      vitrin();
      soyle('Haydi bakalım.');
    }
  }
  function acSheet() {
    var sheet = document.getElementById('dede-sheet');
    sheet.style.display = 'block';
    sheet.innerHTML = '';
    function dugme(ad, fn) {
      var b = el('button');
      b.textContent = ad;
      b.style.display = 'block';
      b.style.width = '100%';
      b.style.margin = '6px 0';
      b.style.padding = '10px';
      b.style.borderRadius = '10px';
      b.style.border = '0';
      b.style.background = '#3a2158';
      b.style.color = '#f6e7bf';
      b.addEventListener('click', fn);
      sheet.appendChild(b);
    }
    dugme('Müzik: ' + (ayar.music ? 'açık' : 'kapalı'), function () { ayar.music = !ayar.music; if (audio) audio.uygula(); acSheet(); });
    dugme('Efekt: ' + (ayar.sfx ? 'açık' : 'kapalı'), function () { ayar.sfx = !ayar.sfx; if (audio) audio.uygula(); acSheet(); });
    dugme('Ses: ' + (ayar.voice ? 'açık' : 'kapalı'), function () { ayar.voice = !ayar.voice; acSheet(); });
    dugme('Titreşim: ' + (ayar.haptics ? 'açık' : 'kapalı'), function () { ayar.haptics = !ayar.haptics; acSheet(); });
    dugme('Performans: ' + (ayar.particles ? 'tam' : 'düşük'), function () { ayar.particles = !ayar.particles; burstN = ayar.particles ? (Number(cfg.particleBurst) || 14) : 6; acSheet(); });
    dugme(state.paused ? 'Devam' : 'Duraklat', function () { state.paused = !state.paused; session.gameState = state.paused ? 'PAUSED' : 'READY'; });
    dugme('Kurallar', function () {
      sheet.innerHTML = '<p style="line-height:1.4">6×5 konak ızgarası. Yan yana duran aynı taşlar 5 ve üzeri olduğunda kazanır, kırılır ve üstten yenileri düşer. Madalyonlar tur sonunda kazancı çarpan olarak toplar. Bakiye yalnızca TEST kredisidir.</p>';
      dugme('Kapat', function () { sheet.style.display = 'none'; ses('UI_close'); });
    });
    dugme('Test oturumunu başlat', function () {
      session = motor.createSession(manifest.economy && manifest.economy.testBalance || 10000);
      session.seed = 'DEDE_TEST_001';
      round = null;
      running = false;
      winShown = 0;
      Object.keys(nodes).forEach(function (id) {
        if (id === 'dede' || id === 'portre') return;
        if (nodes[id].destroy) nodes[id].destroy();
        delete nodes[id];
      });
      hud();
      sheet.style.display = 'none';
    });
    dugme('Kapat', function () { sheet.style.display = 'none'; ses('UI_close'); });
  }
  function acTest() {
    var panel = document.getElementById('dede-test');
    panel.style.display = 'block';
    panel.innerHTML = '';
    var seed = el('input');
    seed.value = session.seed;
    seed.style.width = '100%';
    seed.style.marginBottom = '8px';
    panel.appendChild(seed);
    var bakiye = el('input');
    bakiye.value = String(session.testBalance);
    bakiye.style.width = '100%';
    panel.appendChild(bakiye);
    function dugme(ad, fn) {
      var b = el('button');
      b.textContent = ad;
      b.style.margin = '4px';
      b.addEventListener('click', fn);
      panel.appendChild(b);
    }
    dugme('Tohum', function () { session.seed = seed.value || 'DEDE_TEST_001'; });
    dugme('Bakiye', function () { if (!running) session.testBalance = Math.max(0, Math.round(Number(bakiye.value) || 0)); hud(); });
    dugme('Çöküş', function () { session.force = { cascade: true }; });
    dugme('Çarpan', function () { session.force = { multiplier: true, cascade: true }; });
    dugme('Büyük', function () { session.force = { bigWin: true }; });
    dugme('Varlık hata', function () {
      fail = true;
      session.assetFailure = true;
      session.gameState = 'ERROR';
      document.getElementById('dede-fail').style.display = 'flex';
      post({ type: 'ISSUE', code: 'ASSET_DOWNLOAD_FAILED' });
    });
    dugme('Sessiz', function () { ayar.music = false; ayar.sfx = false; ayar.voice = false; if (audio) audio.uygula(); });
    dugme('Kapat', function () { panel.style.display = 'none'; ses('UI_close'); });
  }
  uiKur();
  var adimlar = ['Sahne hazırlanıyor', '3D varlıklar yükleniyor', 'Sesler yükleniyor', 'Oyun motoru hazırlanıyor'];
  adimYaz(adimlar, 0);
  sahneyiKur();
  adimYaz(adimlar, 1);
  audio = sesKur();
  if (audio) audio.uygula();
  adimYaz(adimlar, 2);
  session.gameState = 'LOADING';
  adimYaz(adimlar, 3);
  if (cfg.assetFailure) {
    fail = true;
    document.getElementById('dede-fail').style.display = 'flex';
    post({ type: 'ISSUE', code: 'ASSET_DOWNLOAD_FAILED' });
  }
  window.setTimeout(hazirBitir, 60);
  state.dede = {
    tick: function (dt) {
      if (state.paused) return;
      clock += dt || 0;
      for (var i = 0; i < mote.length; i++) {
        var m = mote[i];
        if (!m.enabled || !m._life) continue;
        m._life -= dt;
        m.translate((m._vel.x || 0) * dt, (m._vel.y || 0) * dt, (m._vel.z || 0) * dt);
        if (m._life <= 0) m.enabled = false;
      }
      if (!presenter) return;
      var frame = presenter.tick(dt || 0);
      senkron(frame);
      if (frame.gameState === 'CASCADE' && frame.progress < 0.05) ses('cascade');
      if (frame.done && running) {
        motor.commit(session, round);
        running = false;
        presenter = null;
        window.__DEDE_SON = { cascadeIndex: round.cascadeIndex, totalWin: round.totalWin, balance: session.testBalance, state: session.gameState };
        ses('round_end');
        if (round.totalWin <= 0) soyle('');
        document.getElementById('dede-buyuk').style.display = 'none';
        hud();
        post({ type: 'STATS', fps: 0, frameMs: 0, drawCalls: null, code: 'ROUND' });
      }
    },
    safe: function () {
      ui.style.paddingTop = (state.safeTop || 12) + 'px';
      ui.style.paddingBottom = (state.safeBottom || 12) + 'px';
    }
  };
  state.dede.safe();
}

var state = { paused: false, safeTop: 18, safeBottom: 18, dede: null };
function post(msg){ console.log('DEDE', JSON.stringify(msg)); }
var canvas = document.getElementById('c');
var app = new pc.Application(canvas, { mouse: new pc.Mouse(canvas), keyboard: new pc.Keyboard(window) });
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
var cam = new pc.Entity('camera');
cam.addComponent('camera', { clearColor: new pc.Color(0.12,0.06,0.2), fov: 30, nearClip: 0.1, farClip: 80 });
cam.setPosition(0, 0.35, 7.15);
cam.lookAt(0, 0.2, 0);
app.root.addChild(cam);
var manifest = { runtime: 'playcanvas-engine', runtimeVersion: '1.73.4', economy: { mode: 'TEST_BALANCE', testBalance: 10000, currency: 'TEST' }, cascade: { sky: 'sunset', robe: '#6B2450', gemScale: 1, particleBurst: 14, gridOffsetY: 0 } };
dedeKur(state, app, cam, manifest, post);
app.start();
app.on('update', function (dt) { if (state.dede) state.dede.tick(dt); });
window.__DEDE_OYNAT = function () {
  var btn = document.getElementById('dede-oyna');
  if (btn) btn.click();
};
