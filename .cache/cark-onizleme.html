<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>çark</title>
<style>
  body { margin: 0; background: #100c18; color: #fff; font-family: sans-serif; display: flex; gap: 24px; padding: 24px; }
  .kutu { width: 308px; height: 308px; position: relative; border-radius: 154px; background: conic-gradient(from 0deg, transparent, transparent); }
  .a, .b { width: 308px; height: 308px; border-radius: 50%; position: relative; overflow: hidden; background: #120c18; box-shadow: 0 0 0 10px #e6ce92; }
  .bas { margin-bottom: 8px; }
</style>
</head>
<body>
<div>
  <div class="bas">A — apex merkez, taban dışarı</div>
  <div class="a" id="a"></div>
</div>
<div>
  <div class="bas">B — fair spin kopyası</div>
  <div class="b" id="b"></div>
</div>
<script>
const colors = ['#241433','#6e4a16','#3b2158','#8f6420','#4e2c72','#b8892e','#2d1844','#d4a84a'];
const labels = ['0','1/2','1x','2x','3x','5x','8x','10x'];
const R = 144;
const slice = 45;
const taban = R * Math.tan(Math.PI / 8) * 2;

function etiket(derece) {
  const el = document.createElement('div');
  el.style.cssText = 'position:absolute;width:52px;height:32px;left:'+(R-26)+'px;top:'+(R-16)+'px;display:flex;align-items:center;justify-content:center;transform:rotate('+derece+'deg) translateY('+(-R*0.62)+'px);font-weight:800;';
  const t = document.createElement('span');
  t.style.transform = 'rotate('+(-derece)+'deg)';
  t.textContent = labels[derece/45];
  t.style.color = (derece/45)%2 ? '#1a1208' : '#fff';
  el.appendChild(t);
  return el;
}

for (let i = 0; i < 8; i++) {
  const s = document.createElement('div');
  s.style.cssText = [
    'position:absolute',
    'width:0',
    'height:0',
    'left:'+R+'px',
    'top:'+R+'px',
    'border-left:'+(taban/2)+'px solid transparent',
    'border-right:'+(taban/2)+'px solid transparent',
    'border-top:'+R+'px solid '+colors[i],
    'transform:rotate('+(i*slice)+'deg)',
    'transform-origin:center bottom',
  ].join(';');
  document.getElementById('a').appendChild(s);
  document.getElementById('a').appendChild(etiket(i*slice));
}

for (let i = 0; i < 8; i++) {
  const anchor = document.createElement('div');
  anchor.style.cssText = 'position:absolute;height:0;width:'+taban+'px;left:'+(R-taban/2)+'px;top:'+R+'px;overflow:visible;transform:rotate('+(i*slice)+'deg);transform-origin:center center;';
  const tri = document.createElement('div');
  tri.style.cssText = 'width:0;height:0;border-left:'+(taban/2)+'px solid transparent;border-right:'+(taban/2)+'px solid transparent;border-bottom:'+R+'px solid '+colors[i]+';transform:translateY('+(-R)+'px);';
  anchor.appendChild(tri);
  document.getElementById('b').appendChild(anchor);
}
</script>
</body>
</html>
